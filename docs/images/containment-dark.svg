<svg xmlns="http://www.w3.org/2000/svg" width="880" height="344" viewBox="0 0 880 344" role="img" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', Menlo, monospace"><title>Boxes inside boxes, three levels deep. The nesting is the finding: which crate owns which modules, and which of them are the seams everything else depends on.</title><rect x="16" y="16" width="418" height="312" rx="6" fill="#26262d" stroke="#33333c" stroke-width="1"/><text x="30" y="35" fill="#f2f2f5" font-size="13.5">agent-adapt-core</text><text x="30" y="52" fill="#93939e" font-size="11" font-family="-apple-system, BlinkMacSystemFont, system-ui, 'Segoe UI', sans-serif">21 modules, no I/O of its own</text><rect x="30" y="60" width="390" height="84" rx="6" fill="#1f1f25" stroke="#33333c" stroke-width="1"/><text x="44" y="79" fill="#f2f2f5" font-size="13.5">content</text><text x="44" y="98" fill="#f2f2f5" font-size="11.5">vault</text><text x="134.5" y="98" fill="#f2f2f5" font-size="11.5">discover</text><text x="225" y="98" fill="#f2f2f5" font-size="11.5">scan</text><text x="315.5" y="98" fill="#f2f2f5" font-size="11.5">corpus</text><text x="44" y="120" fill="#f2f2f5" font-size="11.5">frontmatter</text><rect x="30" y="156" width="390" height="84" rx="6" fill="#1f1f25" stroke="#33333c" stroke-width="1"/><text x="44" y="175" fill="#f2f2f5" font-size="13.5">build</text><text x="44" y="194" fill="#f2f2f5" font-size="11.5">compile</text><text x="134.5" y="194" fill="#f2f2f5" font-size="11.5">skill</text><text x="225" y="194" fill="#f2f2f5" font-size="11.5">projection</text><text x="315.5" y="194" fill="#f2f2f5" font-size="11.5">manifest</text><text x="44" y="216" fill="#f2f2f5" font-size="11.5">namespace</text><text x="134.5" y="216" fill="#f2f2f5" font-size="11.5">semver</text><rect x="30" y="252" width="390" height="62" rx="6" fill="#1f1f25" stroke="#f2919d" stroke-width="1.5"/><text x="44" y="271" fill="#f2f2f5" font-size="13.5">seams</text><text x="44" y="290" fill="#f2f2f5" font-size="11.5">vfs</text><text x="72.00999999999999" y="290" fill="#93939e" font-size="10" font-family="-apple-system, BlinkMacSystemFont, system-ui, 'Segoe UI', sans-serif">the I/O trait</text><text x="225" y="290" fill="#f2f2f5" font-size="11.5">guard</text><text x="266.35" y="290" fill="#93939e" font-size="10" font-family="-apple-system, BlinkMacSystemFont, system-ui, 'Segoe UI', sans-serif">safety rails</text><rect x="446" y="16" width="418" height="312" rx="6" fill="#26262d" stroke="#33333c" stroke-width="1"/><text x="460" y="35" fill="#f2f2f5" font-size="13.5">hosts</text><text x="460" y="52" fill="#93939e" font-size="11" font-family="-apple-system, BlinkMacSystemFont, system-ui, 'Segoe UI', sans-serif">three crates over one core</text><rect x="460" y="60" width="390" height="80" rx="6" fill="#1f1f25" stroke="#33333c" stroke-width="1"/><text x="474" y="79" fill="#f2f2f5" font-size="13.5">agent-pants</text><text x="474" y="96" fill="#93939e" font-size="11" font-family="-apple-system, BlinkMacSystemFont, system-ui, 'Segoe UI', sans-serif">the CLI</text><text x="474" y="116" fill="#f2f2f5" font-size="11.5">verbs</text><text x="564.5" y="116" fill="#f2f2f5" font-size="11.5">native_vfs</text><text x="655" y="116" fill="#f2f2f5" font-size="11.5">config</text><rect x="460" y="152" width="390" height="80" rx="6" fill="#1f1f25" stroke="#33333c" stroke-width="1"/><text x="474" y="171" fill="#f2f2f5" font-size="13.5">agent-adapt-wasm</text><text x="474" y="188" fill="#93939e" font-size="11" font-family="-apple-system, BlinkMacSystemFont, system-ui, 'Segoe UI', sans-serif">the Obsidian bridge</text><text x="474" y="208" fill="#f2f2f5" font-size="11.5">bridge</text><text x="534.3333333333334" y="208" fill="#f2f2f5" font-size="11.5">js_vfs</text><rect x="460" y="244" width="390" height="62" rx="6" fill="#1f1f25" stroke="#33333c" stroke-width="1"/><text x="474" y="263" fill="#f2f2f5" font-size="13.5">agent-adapt-typegen</text><text x="474" y="282" fill="#f2f2f5" font-size="11.5">emit</text><