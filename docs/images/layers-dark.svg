<svg xmlns="http://www.w3.org/2000/svg" width="880" height="210" viewBox="0 0 880 210" role="img" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', Menlo, monospace"><title>Two tiers cut by a named boundary. The seam is the point: everything above it does I/O, everything below it cannot.</title><defs>
<marker id="mp-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#93939e"/></marker></defs><text x="16" y="28" fill="#93939e" font-size="11.5" font-family="-apple-system, BlinkMacSystemFont, system-ui, 'Segoe UI', sans-serif">HOSTS — where I/O actually happens</text><rect x="16" y="38" width="269.3333333333333" height="50" rx="6" fill="#1f1f25" stroke="#33333c" stroke-width="1"/><text x="30" y="62" fill="#f2f2f5" font-size="13">agent-pants</text><text x="30" y="81" fill="#93939e" font-size="11">the CLI · 15 verbs · native fs</text><rect x="305.3333333333333" y="38" width="269.3333333333333" height="50" rx="6" fill="#1f1f25" stroke="#33333c" stroke-width="1"/><text x="319.3333333333333" y="62" fill="#f2f2f5" font-size="13">agent-adapt-wasm</text><text x="319.3333333333333" y="81" fill="#93939e" font-size="11">Obsidian bridge · js_vfs · no fs</text><rect x="594.6666666666666" y="38" width="269.3333333333333" height="50" rx="6" fill="#1f1f25" stroke="#33333c" stroke-width="1"/><text x="608.6666666666666" y="62" fill="#f2f2f5" font-size="13">agent-adapt-typegen</text><text x="608.6666666666666" y="81" fill="#93939e" font-size="11">emits TS types for the bridge</text><line x1="16" y1="106" x2="864" y2="106" stroke="#f2919d" stroke-width="1.5" stroke-dasharray="6 4"/><rect x="331.285" y="94" width="217.42999999999998" height="24" rx="4" fill="#16161a"/><text x="440" y="110" text-anchor="middle" fill="#f2919d" font-size="11.5" font-family="-apple-system, BlinkMacSystemFont, system-ui, 'Segoe UI', sans-serif">the `Vfs` seam — trait object</text><rect x="16" y="128" width="848" height="66" rx="6" fill="#1f1f25" stroke="#33333c" stroke-width="1"/><text x="30" y="152" fill="#f2f2f5" font-size="13">agent-adapt-core</text><text x="30" y="171" fill="#93939e" font-size="11">21 modules · arithmetic on strings and paths</text><text x="30" y="187" fill="#93939e" font-size="11">compiles to wasm32 and stays pure</text></svg>
