# Repository checks that need no dependencies. The diagram guarantee is only
# worth stating if something holds it: explore-codebase tells an agent that a
# payload cannot produce an SVG which overflows its box, and this is what makes
# that true on every change.
name: checks

on:
  push:
    branches: [main]
    paths:
      - 'src/marketplaces/sdlc/plugins/codebase/skills/explore-codebase/**'
      - 'scripts/**'
      - '.github/workflows/checks.yml'
  pull_request:
    paths:
      - 'src/marketplaces/sdlc/plugins/codebase/skills/explore-codebase/**'
      - 'scripts/**'
      - '.github/workflows/checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagrams:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Renderer and schema agree, and no label escapes its box or the viewBox.
      - run: node scripts/check-diagrams.mjs
