# Builds site/ from the committed marketplace and deploys it to GitHub Pages.
# Needs Settings → Pages → Source set to "GitHub Actions".
name: pages

on:
  push:
    branches: [main]
    paths:
      - '.claude-plugin/**'
      - 'src/**'
      - 'site/**'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - '.claude-plugin/**'
      - 'src/**'
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build
        env:
          SITE_BASE: /${{ github.event.repository.name }}
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: site/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
